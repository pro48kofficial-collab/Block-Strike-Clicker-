<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Full Clicker Game</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

/* LOADING */
#loading{
position:fixed;
inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
z-index:999;
}

/* TOP */
.top{
padding:10px;
font-size:18px;
}

/* BUTTONS */
button{
padding:10px;
margin:5px;
border-radius:10px;
cursor:pointer;
background:#1f2937;
color:white;
border:none;
}

button:hover{
background:#374151;
}

.panel{margin-top:10px}

/* INVENTORY */
.card{
border:1px solid #333;
margin:5px;
padding:5px;
border-radius:10px;
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<div id="loading">Loading Game...</div>

<!-- GAME -->
<div id="game" style="display:none">

<div class="top">
👤 <span id="name">Player</span> <span id="avatar">🔫</span><br>
💰 Coins: <span id="coins">0</span> |
🟡 Gold: <span id="gold">0</span> |
⬆ Upgrade: <span id="upgradeCost">100</span>
</div>

<!-- BUTTONS -->
<div class="panel">

<button onclick="clickGun()">CLICK</button>
<button onclick="upgrade()">UPGRADE</button>

<button onclick="buy('AK-47',100)">AK-47</button>
<button onclick="buy('AWP',300)">AWP</button>
<button onclick="buy('Knife',50)">KNIFE</button>

<button onclick="openCase('Pro',1000)">CASE PRO</button>
<button onclick="openSticker()">STICKER</button>

<button onclick="spinWheel()">🎡 WHEEL 50K</button>

<button onclick="useCode()">PROMO</button>

<button onclick="changeProfile()">PROFILE</button>

</div>

<h3>🎒 Inventory</h3>
<div id="inventory"></div>

<br>
<input id="codeInput" placeholder="Promo code">
<br>
<input id="nickname" placeholder="Name">

</div>

<script>

/* DATA */
let coins=0;
let gold=0;
let upgradeCost=100;
let clickPower=1;
let inventory=[];
let usedCodes=[];

let playerName="Player";
let avatar="🔫";

/* CASES */
const cases={
Pro:["AK Pro","M4 Elite","AWP Star"]
};

/* LOADING */
setTimeout(()=>{
document.getElementById("loading").style.display="none";
document.getElementById("game").style.display="block";
update();
},1200);

/* CLICK */
function clickGun(){
coins++;
gold+=clickPower;
update();
}

/* UPGRADE */
function upgrade(){
if(gold>=upgradeCost){
gold-=upgradeCost;
clickPower=2;
upgradeCost+=100;
update();
}
}

/* SHOP */
function buy(item,price){
if(coins>=price){
coins-=price;
inventory.push(item);
update();
}
}

/* CASE */
function openCase(type,price){
if(gold<price)return;

gold-=price;
let item=cases[type][Math.floor(Math.random()*cases[type].length)];
inventory.push(item);
update();
}

/* STICKER */
function openSticker(){
if(coins<500)return;
coins-=500;
inventory.push("Sticker Pack");
update();
}

/* WHEEL */
function spinWheel(){

if(gold<50000)return;
gold-=50000;

let r=Math.random()*100;

if(r<1){
inventory.push("Bayonet BS");
alert("🔪 SECRET BAYONET!");
}
else if(r<5){
gold+=200000;
alert("💰 200K GOLD");
}
else if(r<10){
inventory.push("AK-47 Legend");
alert("🔫 LEGEND AK");
}
else if(r<30){
gold+=600;
alert("💰 600 GOLD");
}
else{
gold+=100;
alert("💰 100 GOLD");
}

update();
}

/* PROMO */
function useCode(){
let v=document.getElementById("codeInput").value;

if(usedCodes.includes(v)){
alert("Already used");
return;
}

if(v==="Galactic"){
inventory.push("Karambit Galactic");
usedCodes.push(v);
update();
return;
}

gold+=100;
usedCodes.push(v);
update();
}

/* PROFILE */
function changeProfile(){
playerName=document.getElementById("nickname").value||playerName;
update();
}

/* SELL */
function sell(i){
let item=inventory[i];
inventory.splice(i,1);
gold+=100;
update();
}

/* INVENTORY */
function renderInv(){
let html="";
inventory.forEach((i,x)=>{
html+=`
<div class="card">
${i}
<button onclick="sell(${x})">Sell</button>
</div>`;
});
document.getElementById("inventory").innerHTML=html;
}

/* UPDATE */
function update(){

coinsEl.innerText=coins;
goldEl.innerText=gold;
upgradeCostEl.innerText=upgradeCost;

nameEl.innerText=playerName;
avatarEl.innerText=avatar;

renderInv();
save();
}

/* SAVE */
function save(){
localStorage.setItem("save",JSON.stringify({
coins,gold,upgradeCost,clickPower,inventory,usedCodes,
playerName,avatar
}));
}

/* LOAD */
try{
let d=JSON.parse(localStorage.getItem("save"));
if(d){
coins=d.coins||0;
gold=d.gold||0;
upgradeCost=d.upgradeCost||100;
clickPower=d.clickPower||1;
inventory=d.inventory||[];
usedCodes=d.usedCodes||[];
playerName=d.playerName||"Player";
avatar=d.avatar||"🔫";
}
}catch{}

/* ELEMENTS */
const coinsEl=document.getElementById("coins");
const goldEl=document.getElementById("gold");
const upgradeCostEl=document.getElementById("upgradeCost");
const nameEl=document.getElementById("name");
const avatarEl=document.getElementById("avatar");

</script>

</body>
</html>
