<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Strike Clicker FULL</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

#loading{
position:fixed;
inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
z-index:999;
}

.page{display:none;padding:10px}
.active{display:block}

.top{padding:10px;font-size:18px}

button{
padding:10px;
margin:5px;
border-radius:10px;
cursor:pointer;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
overflow-x:auto;
background:#111827;
}

.nav button{
flex:0 0 auto;
min-width:80px;
background:#1f2937;
color:white;
border:none;
}

.card{
border:1px solid #333;
margin:5px;
padding:5px;
border-radius:10px;
}
</style>
</head>

<body>

<div id="loading">Loading Game...</div>

<!-- TOP -->
<div class="top">
👤 <span id="name">Player</span> <span id="avatar">🔫</span><br>
💰 Coins: <span id="coins">0</span> |
🟡 Gold: <span id="gold">0</span>
</div>

<!-- CLICK -->
<div id="click" class="page active">
<h2>🔫 Click</h2>
<img src="image.png" width="140" onclick="clickGun()">
<br>
<button onclick="upgrade()">Upgrade (+1 Gold/click)</button>
</div>

<!-- SHOP -->
<div id="shop" class="page">
<h2>🏪 Магазин</h2>

<button onclick="buy('AK-47',100)">AK-47 - 100</button>
<button onclick="buy('M4A1',150)">M4A1 - 150</button>
<button onclick="buy('AWP',300)">AWP - 300</button>
<button onclick="buy('Deagle',80)">Deagle - 80</button>
<button onclick="buy('Knife',50)">Knife - 50</button>
</div>

<!-- CASES -->
<div id="cases" class="page">
<h2>📦 Кейси</h2>

<button onclick="openCase('Marshmall',200)">🍬 Marshmall</button>
<button onclick="openCase('Sand',400)">🏜 Sand</button>
<button onclick="openCase('Jlister',600)">🧪 Jlister</button>
<button onclick="openCase('Reapel',800)">💀 Reapel</button>
<button onclick="openCase('Pro',1000)">🔥 Pro</button>
<button onclick="openCase('Sticker',500)">📜 Sticker</button>

<p id="caseResult"></p>
</div>

<!-- INVENTORY -->
<div id="inv" class="page">
<h2>🎒 Інвентар</h2>
<div id="inventory"></div>
</div>

<!-- PROMO -->
<div id="promo" class="page">
<h2>🎁 Промокоди</h2>

<input id="codeInput" placeholder="Code">
<br>
<button onclick="useCode()">Activate</button>

<p id="promoMsg"></p>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
<h2>👤 Профіль</h2>

<input id="nickname" placeholder="Name">
<button onclick="saveProfile()">Save</button>

<h3>🎨 Color</h3>
<button onclick="setColor('red')">🔴</button>
<button onclick="setColor('blue')">🔵</button>
<button onclick="setColor('lime')">🟢</button>
<button onclick="setColor('white')">⚪</button>

<h3>🎭 Avatar</h3>
<button onclick="setAvatar('🔫')">🔫</button>
<button onclick="setAvatar('📷')">📷</button>
<button onclick="setAvatar('🎩')">🎩</button>
<button onclick="setAvatar('🕶️')">🕶️</button>

<h3>📊 Stats</h3>
<p>Coins: <span id="statCoins"></span></p>
<p>Gold: <span id="statGold"></span></p>
<p>Items: <span id="statItems"></span></p>
<p>Time: <span id="timePlayed"></span>s</p>

<button onclick="reset()">Reset</button>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('click')">Click</button>
<button onclick="show('shop')">Shop</button>
<button onclick="show('cases')">Cases</button>
<button onclick="show('inv')">Inv</button>
<button onclick="show('promo')">Promo</button>
<button onclick="show('profile')">Profile</button>
</div>

<script>

/* DATA */
let coins=0;
let gold=0;
let upgradeCost=100;
let inventory=[];
let usedCodes=[];
let time=0;

let playerName="Player";
let playerColor="white";
let avatar="🔫";

/* CASES */
const cases={
Marshmall:["AK Marsh","Glock Sweet","Knife Candy"],
Sand:["AWP Sand","AK Desert","M4 Dust"],
Jlister:["AK Toxic","AWP Virus","Deagle Acid"],
Reapel:["AK Reaper","Knife Death","AWP Ghost"],
Pro:["Karambit Galactic","AK Pro","M4 Elite"],
Sticker:["Sticker Skull","Sticker Gold","Sticker Neon"]
};

const prices={
Marshmall:200,Sand:400,Jlister:600,Reapel:800,Pro:1000,Sticker:500
};

/* PROMOS */
const codes=[
"Block Strike","Pro48k","PositIv4IkBS","Update","Gold",
"Marsh","Holiday's","Top","Sand","2025","2026","2027 year",
"BRDAY","Happy year"
];

/* TIMER */
setInterval(()=>{time++;update()},1000);

/* CLICK */
function clickGun(){
coins++;
gold++;
update();
}

/* UPGRADE */
function upgrade(){
if(gold>=upgradeCost){
gold-=upgradeCost;
upgradeCost+=100;
update();
}
}

/* SHOP */
function buy(name,price){
if(coins>=price){
coins-=price;
inventory.push(name);
update();
}
}

/* CASES */
function openCase(type,price){
if(coins<price)return;

coins-=price;

let item=cases[type][Math.floor(Math.random()*cases[type].length)];
inventory.push(item);

caseResult.innerText="🎉 "+item;

update();
}

/* SELL */
function sell(i){
let item=inventory[i];

if(item.includes("Galactic")){
gold+=15000;
}else{
coins+=50;
}

inventory.splice(i,1);
update();
}

/* INVENTORY */
function renderInv(){
let html="";
inventory.forEach((i,x)=>{
html+=`
<div class="card">
${i}
<button onclick="sell(${x})">Sell</button>
</div>`;
});
document.getElementById("inventory").innerHTML=html;
}

/* PROMO */
function useCode(){
let v=document.getElementById("codeInput").value;

if(usedCodes.includes(v)){
promoMsg.innerText="Used";
return;
}

if(v==="Galactic"){
inventory.push("Karambit Galactic");
usedCodes.push(v);
promoMsg.innerText="🔥 Galactic!";
update();
return;
}

if(codes.includes(v)){
gold+=100;
usedCodes.push(v);
promoMsg.innerText="+100 Gold";
update();
}else{
promoMsg.innerText="Wrong code";
}
}

/* PROFILE */
function saveProfile(){
playerName=document.getElementById("nickname").value||playerName;
update();
}

function setColor(c){playerColor=c;update();}
function setAvatar(a){avatar=a;update();}

function reset(){
localStorage.clear();
location.reload();
}

/* UPDATE */
function update(){

coinsEl.innerText=coins;
goldEl.innerText=gold;

nameEl.innerText=playerName;
nameEl.style.color=playerColor;
avatarEl.innerText=avatar;

statCoins.innerText=coins;
statGold.innerText=gold;
statItems.innerText=inventory.length;
timePlayed.innerText=time;

renderInv();
save();
}

/* SAVE */
function save(){
localStorage.setItem("save",JSON.stringify({
coins,gold,upgradeCost,inventory,usedCodes,
playerName,playerColor,avatar,time
}));
}

/* LOAD */
try{
let d=JSON.parse(localStorage.getItem("save"));
if(d){
coins=d.coins||0;
gold=d.gold||0;
upgradeCost=d.upgradeCost||100;
inventory=d.inventory||[];
usedCodes=d.usedCodes||[];
playerName=d.playerName||"Player";
playerColor=d.playerColor||"white";
avatar=d.avatar||"🔫";
time=d.time||0;
}
}catch{}

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

/* ELEMENTS */
const coinsEl=document.getElementById("coins");
const goldEl=document.getElementById("gold");
const nameEl=document.getElementById("name");
const avatarEl=document.getElementById("avatar");

const statCoins=document.getElementById("statCoins");
const statGold=document.getElementById("statGold");
const statItems=document.getElementById("statItems");
const timePlayed=document.getElementById("timePlayed");

const promoMsg=document.getElementById("promoMsg");
const caseResult=document.getElementById("caseResult");

/* LOADING */
setTimeout(()=>{
document.getElementById("loading").style.display="none";
update();
},1200);

</script>

</body>
  </html>
