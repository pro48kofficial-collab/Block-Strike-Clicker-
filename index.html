<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Strike Clicker</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0a0f1f;
    color:#fff;
}

/* LOADING */
#loading{
    position:fixed;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
}
.loader{
    border:5px solid #222;
    border-top:5px solid #00f0ff;
    border-radius:50%;
    width:60px;
    height:60px;
    animation:spin 1s linear infinite;
}
@keyframes spin{
    0%{transform:rotate(0)}
    100%{transform:rotate(360deg)}
}

/* TOP */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#111827;
    padding:10px;
}
.profile{display:flex;align-items:center;}
.avatar{
    width:40px;height:40px;border-radius:50%;
    border:2px solid #00f0ff;margin-right:10px;
}

/* SCREEN */
.screen{display:none;padding:10px;}
.active{display:block;}

button{
    width:90%;
    margin:5px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#00f0ff,#0066ff);
    color:white;
    font-weight:bold;
}

.card{
    background:#111827;
    padding:10px;
    margin:5px;
    border-radius:10px;
}

/* IMAGE */
.main-img{
    width:40vw;
    max-width:220px;
    min-width:140px;
    margin:10px;
    transition:0.1s;
}

/* PULSE */
@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.1)}
    100%{transform:scale(1)}
}
.pulse{animation:pulse 0.2s;}

/* RARITY */
.common{color:#aaa}
.rare{color:#3aa0ff}
.epic{color:#c04cff}
.legendary{color:#ff9f00}
.mythic{color:#ff3b3b}
</style>
</head>

<body>

<div id="loading">
    <div class="loader"></div>
    <h2>Загрузка...</h2>
</div>

<div class="top">
    <div class="profile">
        <img id="avatar" class="avatar">
        <div id="nick">Гравець</div>
    </div>
    <div>💰 <span id="gold">0</span> | 🪙 <span id="silver">0</span></div>
</div>

<!-- MENU -->
<div id="menu" class="screen active">
<center>
<img src="image.png" class="main-img"><br>

<button onclick="clickGold()">КЛІК</button>
<button onclick="buyUpgrade()">Апгрейд (+1)</button>
<div id="upgradePrice"></div>

<button onclick="openScreen('shop')">Магазин</button>
<button onclick="openScreen('inventory')">Інвентар</button>
<button onclick="openScreen('cases')">Кейси</button>
<button onclick="openScreen('promo')">Промокоди</button>
<button onclick="openScreen('profileScreen')">Профіль</button>
</center>
</div>

<!-- SHOP -->
<div id="shop" class="screen">
<h2>Магазин</h2>
<div id="shopItems"></div>
<button onclick="openScreen('menu')">Назад</button>
</div>

<!-- INVENTORY -->
<div id="inventory" class="screen">
<h2>Інвентар</h2>
<div id="inv"></div>
<button onclick="openScreen('menu')">Назад</button>
</div>

<!-- CASES -->
<div id="cases" class="screen">
<h2>Кейси</h2>
<button onclick="openCase('Marshmall',200)">Marshmall (200G)</button>
<button onclick="openCase('Past Reapel',300)">Past Reapel (300G)</button>
<button onclick="openCase('Jlister',500)">Jlister (500G)</button>
<button onclick="openCase('Sand of Time',1000)">Sand of Time (1000G)</button>
<button onclick="openCase('Pro',1500)">Pro (1500G)</button>
<button onclick="openCaseSilver()">Sticker 😊 (600S)</button>
<button onclick="openScreen('menu')">Назад</button>
</div>

<!-- PROMO -->
<div id="promo" class="screen">
<h2>Промокод</h2>
<input id="promoInput">
<button onclick="usePromo()">Ввести</button>
<div id="promoMsg"></div>
<button onclick="openScreen('menu')">Назад</button>
</div>

<!-- PROFILE -->
<div id="profileScreen" class="screen">
<h2>Профіль</h2>

<input id="nameInput" placeholder="Нік">
<button onclick="saveName()">Зберегти</button><br>

<input type="color" id="colorPick">
<button onclick="setColor()">Колір</button><br>

<input type="file" onchange="changeAvatar(event)"><br>

<button onclick="resetGame()">Скинути прогрес</button>

<h3>Статистика</h3>
<div id="stats"></div>

<button onclick="openScreen('menu')">Назад</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem("bs_clicker")) || {
gold:0,silver:0,click:1,upgrade:100,
inv:[],avatar:"",name:"Гравець",color:"#fff",
usedPromo:[],
stats:{clicks:0,time:0,earnedGold:0,spentGold:0,earnedSilver:0,spentSilver:0}
};

setInterval(()=>{data.stats.time++;save()},1000);

function save(){localStorage.setItem("bs_clicker",JSON.stringify(data));}

function update(){
gold.innerText=data.gold;
silver.innerText=data.silver;
nick.innerText=data.name;
nick.style.color=data.color;
avatar.src=data.avatar||"https://cdn-icons-png.flaticon.com/512/149/149071.png";
upgradePrice.innerText="Ціна: "+data.upgrade;
renderShop();renderInv();renderStats();
}

function clickGold(){
data.gold+=data.click;
data.silver+=data.click;
data.stats.clicks++;

let img=document.querySelector(".main-img");
img.classList.add("pulse");
setTimeout(()=>img.classList.remove("pulse"),200);

update();save();
}

function buyUpgrade(){
if(data.gold>=data.upgrade){
data.gold-=data.upgrade;
data.click++;
data.upgrade+=100;
}
update();save();
}

function openScreen(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* SHOP */
let weapons=["AK-47","M4","P90","AWP","Deagle","UMP","MP5","Famas","Glock","Knife","Karambit","Shotgun","Sniper","USP","Vector","Aug","SG","CZ","R8","MAC10"];

function renderShop(){
shopItems.innerHTML="";
weapons.forEach(w=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`${w} - 200G <button onclick="buyWeapon('${w}')">Купити</button>`;
shopItems.appendChild(div);
});
}

function buyWeapon(w){
if(data.gold>=200){
data.gold-=200;
data.inv.push({name:w,price:200,rare:"common"});
}
update();save();
}

/* INVENTORY */
function renderInv(){
inv.innerHTML="";
data.inv.forEach((item,i)=>{
let div=document.createElement("div");
div.className="card "+item.rare;
div.innerHTML=`${item.name} (${item.rare})
<button onclick="sell(${i})">Продати</button>`;
inv.appendChild(div);
});
}

function sell(i){
let item=data.inv[i];
if(item.secret)return;
data.gold+=item.price;
data.inv.splice(i,1);
update();save();
}

/* CASES */
function openCase(name,price){
if(data.gold<price)return;
data.gold-=price;

let rares=["common","rare","epic","legendary"];
let r=rares[Math.floor(Math.random()*rares.length)];

data.inv.push({
name:name+" Skin",
rare:r,
price:Math.floor(Math.random()*500)+100
});

update();save();
}

function openCaseSilver(){
if(data.silver<600)return;
data.silver-=600;

data.inv.push({name:"Sticker 😊",rare:"rare",price:300});

update();save();
}

/* PROMO */
function usePromo(){
let p=promoInput.value;
if(data.usedPromo.includes(p))return;

let g=["Pro","PositIv4IkBS","ZCY11K","Block Strike","Update","Holiday","2025","2026","2027"];
let s=["XX25","Top","BS","GG","Serebro"];

if(g.includes(p)) data.gold+=100;
else if(s.includes(p)) data.silver+=500;
else if(p==="SekretXX56") data.inv.push({name:"Karambit Gold",rare:"mythic",secret:true});
else if(p==="TopBHGF65") data.inv.push({name:"P90 Marsh",rare:"legendary",secret:true});

data.usedPromo.push(p);
update();save();
}

/* PROFILE */
function saveName(){data.name=nameInput.value;update();save();}
function setColor(){data.color=colorPick.value;update();save();}

function changeAvatar(e){
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=()=>{data.avatar=reader.result;update();save();}
reader.readAsDataURL(file);
}

function renderStats(){
stats.innerHTML=`
Кліків: ${data.stats.clicks}<br>
Час: ${data.stats.time} сек<br>
Скінів: ${data.inv.length}
`;
}

function resetGame(){
localStorage.clear();
location.reload();
}

/* LOADING */
window.onload=()=>{setTimeout(()=>loading.style.display="none",1500);};

update();
</script>

</body>
    </html>
