<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Strike Clicker</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
  text-align:center;
}

.top{
  padding:10px;
  font-size:18px;
}

.page{display:none; padding:10px;}
.active{display:block;}

button{
  padding:10px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
}

.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#111827;
}

.nav button{
  flex:1;
  border:none;
  background:#1f2937;
  color:white;
  padding:10px;
}

.card{
  border:1px solid #333;
  margin:5px;
  padding:5px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="top">
💰 Coins: <span id="coins">0</span> | 🟡 Gold: <span id="gold">0</span> | 🔥 Power: <span id="power">1</span>
</div>

<!-- CLICK -->
<div id="click" class="page active">
  <h2>🔫 Click</h2>
  <img src="image.png" width="160" onclick="clickGun()" style="cursor:pointer">
  <br><br>
  <button onclick="upgrade()">🔼 Upgrade (100 Gold)</button>
</div>

<!-- SHOP -->
<div id="shop" class="page">
<h2>🏪 Магазин</h2>

<button onclick="buy('AK-47',100)">AK-47 - 100</button>
<button onclick="buy('M4A1',150)">M4A1 - 150</button>
<button onclick="buy('AWP',300)">AWP - 300</button>
<button onclick="buy('Deagle',80)">Deagle - 80</button>
<button onclick="buy('Glock',50)">Glock - 50</button>
<button onclick="buy('Knife',40)">Knife - 40</button>
<button onclick="buy('P90',120)">P90 - 120</button>
<button onclick="buy('Shotgun',200)">Shotgun - 200</button>
</div>

<!-- CASES -->
<div id="cases" class="page">
<h2>📦 Кейси</h2>

<div style="display:flex; overflow-x:auto; gap:10px; padding:10px;">
  <button onclick="openCase('Marshmall')">Marsh 200</button>
  <button onclick="openCase('Sand of Time')">Sand 400</button>
  <button onclick="openCase('Jlister')">Jlister 600</button>
  <button onclick="openCase('Past Reapel')">Reapel 800</button>
  <button onclick="openCase('Pro')">Pro 1000</button>
  <button onclick="openCase('Sticker')">Sticker 500</button>
</div>

<p id="caseResult"></p>
</div>

<!-- INVENTORY -->
<div id="inv" class="page">
<h2>🎒 Інвентар</h2>
<div id="inventory"></div>
</div>

<!-- PROMO -->
<div id="promo" class="page">
<h2>🎁 Промокоди</h2>

<input id="codeInput" placeholder="Enter code">
<br><br>
<button onclick="useCode()">Activate</button>

<p id="promoMsg"></p>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('click')">Click</button>
<button onclick="show('shop')">Shop</button>
<button onclick="show('cases')">Cases</button>
<button onclick="show('inv')">Inventory</button>
<button onclick="show('promo')">Promo</button>
</div>

<script>

let coins = 0;
let gold = 0;
let power = 1;
let upgradeCost = 100;

let inventory = [];
let usedCodes = [];

/* CASES */
const cases = {
"Marshmall": ["AK Marsh (Common)", "Knife Marsh (Rare)", "M4 Marsh (Epic)"],
"Sand of Time": ["AWP Sand (Rare)", "Deagle Sand (Epic)", "AK Sand (Legendary)"],
"Jlister": ["Glock J (Common)", "P90 J (Rare)", "M4 J (Epic)"],
"Past Reapel": ["Reaper AK (Epic)", "Ghost Knife (Legendary)", "Dark AWP (Mythic)"],
"Pro": ["Sticker Dragon Pro (Legendary)", "Sticker Neon Pro (Mythic)", "Sticker Gold Pro (Mythic+)"],
"Sticker": ["Sticker Skull (Common)", "Sticker Flame (Rare)", "Sticker Neon (Epic)", "Sticker Gold Beast (Legendary)"]
};

const casePrices = {
"Marshmall": 200,
"Sand of Time": 400,
"Jlister": 600,
"Past Reapel": 800,
"Pro": 1000,
"Sticker": 500
};

/* PROMO */
const codes = [
"Block Strike","Pro48k","PositIv4IkBS","Update","Gold",
"Marsh","Holiday's","Top","Sand","2025","2026","2027 year",
"BRDAY","Happy year"
];

/* LOAD */
if(localStorage.getItem("save")){
let data = JSON.parse(localStorage.getItem("save"));

coins = data.coins || 0;
gold = data.gold || 0;
power = data.power || 1;
inventory = data.inventory || [];
usedCodes = data.usedCodes || [];
upgradeCost = data.upgradeCost || 100;

update();
}

/* CLICK (+1 +1) */
function clickGun(){
coins += 1;
gold += 1;
update();
}

/* UPGRADE */
function upgrade(){
if(gold >= upgradeCost){
gold -= upgradeCost;
power++;
upgradeCost += 100;
update();
}
}

/* SHOP */
function buy(name, price){
if(coins >= price){
coins -= price;
inventory.push(name);
update();
}
}

/* CASES */
function openCase(type){

let price = casePrices[type];

let currency = (type === "Sticker") ? "coins" : "gold";

if(currency === "coins"){
if(coins < price){ alert("Not enough Coins!"); return; }
coins -= price;
} else {
if(gold < price){ alert("Not enough Gold!"); return; }
gold -= price;
}

let items = cases[type];
let item = items[Math.floor(Math.random()*items.length)];

inventory.push(item);

document.getElementById("caseResult").innerText = "🎉 " + item;

update();
}

/* SELL */
function sell(i){
coins += 25;
inventory.splice(i,1);
update();
}

/* INVENTORY */
function renderInv(){
let html = "";

inventory.forEach((item,i)=>{
html += `
<div class="card">
${item}
<button onclick="sell(${i})">Sell 25💰</button>
</div>`;
});

document.getElementById("inventory").innerHTML = html;
}

/* PROMO */
function useCode(){
let val = document.getElementById("codeInput").value;

if(usedCodes.includes(val)){
document.getElementById("promoMsg").innerText = "Already used!";
return;
}

if(codes.includes(val)){
gold += 100;
usedCodes.push(val);
document.getElementById("promoMsg").innerText = "+100 Gold!";
update();
} else {
document.getElementById("promoMsg").innerText = "Invalid code";
}
}

/* UPDATE */
function update(){
document.getElementById("coins").innerText = coins;
document.getElementById("gold").innerText = gold;
document.getElementById("power").innerText = power;

renderInv();
save();
}

/* SAVE */
function save(){
localStorage.setItem("save", JSON.stringify({
coins,
gold,
power,
inventory,
usedCodes,
upgradeCost
}));
}

/* NAV */
function show(page){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(page).classList.add("active");
}

</script>

</body>
  </html>
