<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Strike Clicker</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white;text-align:center}

/* LOADING */
#loading{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
z-index:999;
}

/* UI */
.top{padding:10px}
.page{display:none;padding:10px}
.active{display:block}

button{padding:10px;margin:5px;border-radius:10px;cursor:pointer}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#111827;
}
.nav button{flex:1;background:#1f2937;color:white;border:none}

.card{
border:1px solid #333;
margin:5px;
padding:5px;
border-radius:10px;
}
</style>
</head>

<body>

<div id="loading">Loading...</div>

<div class="top">
<span id="name">Player</span> <span id="avatar">🔫</span><br>
💰 <span id="coins">0</span> | 🟡 <span id="gold">0</span> | 🔥 <span id="power">1</span>
</div>

<!-- CLICK -->
<div id="click" class="page active">
<h2>🔫 Click</h2>
<img src="image.png" width="150" onclick="clickGun()" style="cursor:pointer">
<br>
<button onclick="upgrade()">Upgrade (<span id="upgradeCost">100</span> Gold)</button>
</div>

<!-- SHOP -->
<div id="shop" class="page">
<h2>🏪 Магазин</h2>
<button onclick="buy('AK-47',100)">AK-47</button>
<button onclick="buy('AWP',300)">AWP</button>
<button onclick="buy('Knife',50)">Knife</button>
</div>

<!-- CASES -->
<div id="cases" class="page">
<h2>📦 Кейси</h2>

<div style="display:flex;overflow-x:auto;">
<button onclick="openCase('Marshmall')">200</button>
<button onclick="openCase('Sand')">400</button>
<button onclick="openCase('Jlister')">600</button>
<button onclick="openCase('Reapel')">800</button>
<button onclick="openCase('Pro')">1000</button>
<button onclick="openCase('Sticker')">500 coins</button>
</div>

<p id="caseResult"></p>
</div>

<!-- INVENTORY -->
<div id="inv" class="page">
<h2>🎒 Інвентар</h2>
<div id="inventory"></div>
</div>

<!-- PROMO -->
<div id="promo" class="page">
<h2>🎁 Промокоди</h2>
<input id="codeInput">
<button onclick="useCode()">OK</button>
<p id="promoMsg"></p>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
<h2>👤 Профіль</h2>

<input id="nickname" placeholder="Name">
<input id="color" placeholder="Color">
<button onclick="saveProfile()">Save</button>

<h3>Аватар</h3>
<button onclick="setAvatar('🔫')">🔫</button>
<button onclick="setAvatar('📷')">📷</button>
<button onclick="setAvatar('🎩')">🎩</button>
<button onclick="setAvatar('📺')">📺</button>
<button onclick="setAvatar('🎥')">🎥</button>
<button onclick="setAvatar('🧸')">🧸</button>
<button onclick="setAvatar('🕶️')">🕶️</button>

<h3>📊 Статистика</h3>
<p>Coins earned: <span id="statCoins"></span></p>
<p>Coins spent: <span id="statCoinsSpent"></span></p>
<p>Gold earned: <span id="statGold"></span></p>
<p>Gold spent: <span id="statGoldSpent"></span></p>
<p>Skins earned: <span id="statSkins"></span></p>
<p>Inventory: <span id="statInv"></span></p>

<button onclick="reset()">Reset Progress</button>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('click')">Click</button>
<button onclick="show('shop')">Shop</button>
<button onclick="show('cases')">Cases</button>
<button onclick="show('inv')">Inv</button>
<button onclick="show('promo')">Promo</button>
<button onclick="show('profile')">Profile</button>
</div>

<script>

let coins=0,gold=0,power=1,upgradeCost=100;
let inventory=[],usedCodes=[];

let stats={
coinsEarned:0,
coinsSpent:0,
goldEarned:0,
goldSpent:0,
skins:0
};

let playerName="Player",playerColor="white",avatar="🔫";

/* CASES */
const cases={
Marshmall:["Common","Rare"],
Sand:["Rare","Epic"],
Jlister:["Epic"],
Reapel:["Legendary"],
Pro:["Mythic"],
Sticker:["Sticker"]
};

const prices={
Marshmall:200,Sand:400,Jlister:600,Reapel:800,Pro:1000,Sticker:500
};

/* LOAD */
if(localStorage.getItem("save")){
let d=JSON.parse(localStorage.getItem("save"));
coins=d.coins||0;
gold=d.gold||0;
power=d.power||1;
upgradeCost=d.upgradeCost||100;
inventory=d.inventory||[];
usedCodes=d.usedCodes||[];
stats=d.stats||stats;
playerName=d.playerName||"Player";
playerColor=d.playerColor||"white";
avatar=d.avatar||"🔫";
}

/* LOADING */
window.onload=()=>{
setTimeout(()=>{document.getElementById("loading").style.display="none";},1000);
update();
};

/* CLICK */
function clickGun(){
coins+=1;
gold+=1;
stats.coinsEarned++;
stats.goldEarned++;
update();
}

/* UPGRADE */
function upgrade(){
if(gold>=upgradeCost){
gold-=upgradeCost;
stats.goldSpent+=upgradeCost;
power++;
upgradeCost+=100;
update();
}
}

/* BUY */
function buy(n,p){
if(coins>=p){
coins-=p;
stats.coinsSpent+=p;
inventory.push(n);
stats.skins++;
update();
}
}

/* CASE */
function openCase(t){
let p=prices[t];

if(t==="Sticker"){
if(coins<p){alert("No coins");return;}
coins-=p;
stats.coinsSpent+=p;
}else{
if(gold<p){alert("No gold");return;}
gold-=p;
stats.goldSpent+=p;
}

let arr=cases[t];
let item=arr[Math.floor(Math.random()*arr.length)];

inventory.push(item);
stats.skins++;

document.getElementById("caseResult").innerText=item;

update();
}

/* INVENTORY */
function renderInv(){
let html="";
inventory.forEach((i,x)=>{
html+=`<div class="card">${i}<button onclick="sell(${x})">Sell</button></div>`;
});
document.getElementById("inventory").innerHTML=html;
}

/* SELL */
function sell(i){
coins+=25;
inventory.splice(i,1);
update();
}

/* PROMO */
const codes=[
"Block Strike","Pro48k","PositIv4IkBS","Update","Gold",
"Marsh","Holiday's","Top","Sand","2025","2026","2027 year",
"BRDAY","Happy year"
];

function useCode(){
let val=document.getElementById("codeInput").value;

if(usedCodes.includes(val)){
document.getElementById("promoMsg").innerText="Used";
return;
}

if(codes.includes(val)){
gold+=100;
stats.goldEarned+=100;
usedCodes.push(val);
document.getElementById("promoMsg").innerText="+100 Gold";
update();
}else{
document.getElementById("promoMsg").innerText="Invalid";
}
}

/* PROFILE */
function saveProfile(){
playerName=document.getElementById("nickname").value||playerName;
playerColor=document.getElementById("color").value||playerColor;
update();
}

function setAvatar(a){
avatar=a;
update();
}

function reset(){
localStorage.clear();
location.reload();
}

/* UPDATE */
function update(){

document.getElementById("coins").innerText=coins;
document.getElementById("gold").innerText=gold;
document.getElementById("power").innerText=power;
document.getElementById("upgradeCost").innerText=upgradeCost;

document.getElementById("name").innerText=playerName;
document.getElementById("name").style.color=playerColor;
document.getElementById("avatar").innerText=avatar;

document.getElementById("statCoins").innerText=stats.coinsEarned;
document.getElementById("statCoinsSpent").innerText=stats.coinsSpent;
document.getElementById("statGold").innerText=stats.goldEarned;
document.getElementById("statGoldSpent").innerText=stats.goldSpent;
document.getElementById("statSkins").innerText=stats.skins;
document.getElementById("statInv").innerText=inventory.length;

renderInv();
save();
}

/* SAVE */
function save(){
localStorage.setItem("save", JSON.stringify({
coins,gold,power,upgradeCost,inventory,usedCodes,stats,playerName,playerColor,avatar
}));
}

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

</script>

</body>
  </html>
