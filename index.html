<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Strike Clicker</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white;text-align:center}

#loading{
position:fixed;inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
z-index:999;
}

.top{padding:10px}
.page{display:none;padding:10px}
.active{display:block}

button{padding:10px;margin:5px;border-radius:10px;cursor:pointer}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
overflow-x:auto;
background:#111827;
}

.nav button{
flex:0 0 auto;
min-width:85px;
background:#1f2937;
color:white;
border:none;
}

.card{
border:1px solid #333;
margin:5px;
padding:5px;
border-radius:10px;
}
.colors button{width:30px;height:30px;border:none;margin:3px}
</style>
</head>

<body>

<div id="loading">Loading Game...</div>

<div class="top">
<span id="name">Player</span> <span id="avatar">🔫</span><br>
💰 <span id="coins">0</span> | 🟡 <span id="gold">0</span>
</div>

<!-- CLICK -->
<div id="click" class="page active">
<h2>🔫 Click</h2>
<img src="image.png" width="140" onclick="clickGun()">
<br>
<button onclick="upgrade()">Upgrade</button>
</div>

<!-- SHOP -->
<div id="shop" class="page">
<h2>🏪 Магазин</h2>

<button onclick="buy('AK-47',100)">AK-47</button>
<button onclick="buy('M4A1',150)">M4A1</button>
<button onclick="buy('AWP',300)">AWP</button>
<button onclick="buy('Deagle',80)">Deagle</button>
<button onclick="buy('Knife',50)">Knife</button>
</div>

<!-- CASES -->
<div id="cases" class="page">
<h2>📦 Кейси</h2>

<div style="display:flex;overflow-x:auto;">
<button onclick="openCase('Basic')">🟤200</button>
<button onclick="openCase('Rare')">🔵400</button>
<button onclick="openCase('Epic')">🟣600</button>
<button onclick="openCase('Legend')">🟡800</button>
<button onclick="openCase('Pro')">🔴1000</button>
<button onclick="openCase('Sticker')">📜500</button>
</div>

<p id="caseResult"></p>
</div>

<!-- INVENTORY -->
<div id="inv" class="page">
<h2>🎒 Інвентар</h2>
<div id="inventory"></div>
</div>

<!-- PROMO -->
<div id="promo" class="page">
<h2>🎁 Промокоди</h2>

<input id="codeInput" placeholder="Enter code">
<br>
<button onclick="useCode()">Activate</button>

<p id="promoMsg"></p>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
<h2>👤 Профіль</h2>

<input id="nickname" placeholder="Name">
<button onclick="saveProfile()">Save</button>

<h3>🎨 Колір</h3>
<div class="colors">
<button style="background:red" onclick="setColor('red')"></button>
<button style="background:blue" onclick="setColor('blue')"></button>
<button style="background:lime" onclick="setColor('lime')"></button>
<button style="background:yellow" onclick="setColor('yellow')"></button>
</div>

<h3>🎭 Аватар</h3>
<button onclick="setAvatar('🔫')">🔫</button>
<button onclick="setAvatar('📷')">📷</button>
<button onclick="setAvatar('🎩')">🎩</button>
<button onclick="setAvatar('🕶️')">🕶️</button>

<h3>📊 Статистика</h3>
<p>Coins: <span id="statCoins"></span></p>
<p>Gold: <span id="statGold"></span></p>
<p>Skins: <span id="statSkins"></span></p>
<p>Time: <span id="timePlayed"></span>s</p>

<button onclick="reset()">Reset</button>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('click')">Click</button>
<button onclick="show('shop')">Shop</button>
<button onclick="show('cases')">Cases</button>
<button onclick="show('inv')">Inv</button>
<button onclick="show('promo')">Promo</button>
<button onclick="show('profile')">Profile</button>
</div>

<script>

let coins=0,gold=0,upgradeCost=100;
let inventory=[],time=0;
let usedCodes=[];

let stats={coins:0,gold:0,skins:0};

let name="Player",color="white",avatar="🔫";

/* CASES */
const cases={
Basic:["AK-47","M4A1","Glock"],
Rare:["AWP","P90","M4 Blue"],
Epic:["AK Neon","AWP Fire","Knife Flame"],
Legend:["AWP Mythic","AK Galaxy","Deagle Ultra"],
Pro:["Karambit Galactic","AK Pro","AWP Star"],
Sticker:["Sticker Skull","Sticker Fire","Sticker Gold"]
};

const prices={
Basic:200,Rare:400,Epic:600,Legend:800,Pro:1000,Sticker:500
};

/* PROMOS */
const codes=[
"Block Strike","Pro48k","PositIv4IkBS","Update","Gold",
"Marsh","Holiday's","Top","Sand","2025","2026","2027 year",
"BRDAY","Happy year"
];

/* LOAD */
try{
let d=JSON.parse(localStorage.getItem("save"));
if(d){
Object.assign(window,d);
}
}catch{}

/* TIMER */
setInterval(()=>{time++;update()},1000);

/* CLICK */
function clickGun(){
coins++;
gold++;
stats.coins++;
stats.gold++;
update();
}

/* UPGRADE */
function upgrade(){
if(gold>=upgradeCost){
gold-=upgradeCost;
upgradeCost+=100;
update();
}
}

/* SHOP */
function buy(n,p){
if(coins>=p){
coins-=p;
inventory.push(n);
stats.skins++;
update();
}
}

/* CASES */
function openCase(t){
let p=prices[t];

if(t==="Sticker"){
if(coins<p)return;
coins-=p;
}else{
if(gold<p)return;
gold-=p;
}

let item=cases[t][Math.floor(Math.random()*cases[t].length)];

inventory.push(item);
stats.skins++;

caseResult.innerText="🎉 "+item;

update();
}

/* SELL */
function sell(i){
let item=inventory[i];

if(item.includes("Galactic")){
gold+=15000;
}else{
coins+=25;
}

inventory.splice(i,1);
update();
}

/* INVENTORY */
function renderInv(){
let html="";
inventory.forEach((i,x)=>{
html+=`<div class="card">${i}<button onclick="sell(${x})">Sell</button></div>`;
});
inventory.innerHTML=html;
}

/* PROMO */
function useCode(){
let v=document.getElementById("codeInput").value;

if(usedCodes.includes(v)){
promoMsg.innerText="Used";
return;
}

if(v==="Galactic"){
inventory.push("Karambit Galactic");
usedCodes.push(v);
promoMsg.innerText="🔥 Galactic Knife!";
update();
return;
}

if(codes.includes(v)){
gold+=100;
stats.gold+=100;
usedCodes.push(v);
promoMsg.innerText="+100 Gold";
update();
}else{
promoMsg.innerText="Wrong code";
}
}

/* PROFILE */
function saveProfile(){
name=document.getElementById("nickname").value||name;
update();
}
function setColor(c){color=c;update();}
function setAvatar(a){avatar=a;update();}
function reset(){localStorage.clear();location.reload();}

/* UPDATE */
function update(){

coinsEl.innerText=coins;
goldEl.innerText=gold;

nameEl.innerText=name;
nameEl.style.color=color;
avatarEl.innerText=avatar;

statCoins.innerText=stats.coins;
statGold.innerText=stats.gold;
statSkins.innerText=stats.skins;
timePlayed.innerText=time;

renderInv();
save();
}

/* SAVE */
function save(){
localStorage.setItem("save",JSON.stringify({
coins,gold,upgradeCost,inventory,stats,name,color,avatar,time,usedCodes
}));
}

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

/* ELEMENTS */
const coinsEl=document.getElementById("coins");
const goldEl=document.getElementById("gold");
const nameEl=document.getElementById("name");
const avatarEl=document.getElementById("avatar");
const statCoins=document.getElementById("statCoins");
const statGold=document.getElementById("statGold");
const statSkins=document.getElementById("statSkins");
const timePlayed=document.getElementById("timePlayed");
const promoMsg=document.getElementById("promoMsg");
const caseResult=document.getElementById("caseResult");

/* LOADING */
setTimeout(()=>{
document.getElementById("loading").style.display="none";
update();
},1200);

</script>

</body>
  </html>
