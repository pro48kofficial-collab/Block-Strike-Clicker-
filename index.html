<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Clicker</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white;text-align:center}
#loading{position:fixed;width:100%;height:100%;background:black;display:flex;justify-content:center;align-items:center;font-size:30px;z-index:999}

.top{padding:10px}
.page{display:none;padding:10px}
.active{display:block}

button{padding:10px;margin:5px;border-radius:10px;cursor:pointer}

.nav{
position:fixed;bottom:0;width:100%;
display:flex;overflow-x:auto;
background:#111827;
}
.nav button{
flex:0 0 auto;
min-width:80px;
background:#1f2937;
color:white;border:none;
}

.card{
border:1px solid #333;
margin:5px;padding:5px;
border-radius:10px;
}

.colors button{
width:30px;height:30px;border:none;margin:3px;
}
</style>
</head>

<body>

<div id="loading">Loading...</div>

<div class="top">
<span id="name">Player</span> <span id="avatar">🔫</span><br>
💰 <span id="coins">0</span> | 🟡 <span id="gold">0</span>
</div>

<!-- CLICK -->
<div id="click" class="page active">
<h2>🔫 Click</h2>
<img src="image.png" width="140" onclick="clickGun()" style="cursor:pointer">
<br>
<button onclick="upgrade()">Upgrade (<span id="upgradeCost">100</span>)</button>
</div>

<!-- SHOP -->
<div id="shop" class="page">
<h2>🏪 Магазин</h2>
<button onclick="buy('AK-47',100)">AK-47 - 100</button>
<button onclick="buy('AWP',300)">AWP - 300</button>
<button onclick="buy('Knife',50)">Knife - 50</button>
</div>

<!-- CASES -->
<div id="cases" class="page">
<h2>📦 Кейси</h2>
<div style="display:flex;overflow-x:auto;">
<button onclick="openCase('Marshmall')">🍬 200</button>
<button onclick="openCase('Sand')">🏜 400</button>
<button onclick="openCase('Jlister')">🧪 600</button>
<button onclick="openCase('Reapel')">💀 800</button>
<button onclick="openCase('Pro')">🔥 1000</button>
<button onclick="openCase('Sticker')">📜 500 coins</button>
</div>
<p id="caseResult"></p>
</div>

<!-- INVENTORY -->
<div id="inv" class="page">
<h2>🎒 Інвентар</h2>
<div id="inventory"></div>
</div>

<!-- PROMO -->
<div id="promo" class="page">
<h2>🎁 Промокоди</h2>
<input id="codeInput" placeholder="Введи код">
<br><br>
<button onclick="useCode()">Активувати</button>
<p id="promoMsg"></p>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
<h2>👤 Профіль</h2>

<input id="nickname" placeholder="Name">
<button onclick="saveProfile()">Save</button>

<h3>🎨 Колір ніку</h3>
<div class="colors">
<button style="background:red" onclick="setColor('red')"></button>
<button style="background:blue" onclick="setColor('blue')"></button>
<button style="background:lime" onclick="setColor('lime')"></button>
<button style="background:yellow" onclick="setColor('yellow')"></button>
<button style="background:cyan" onclick="setColor('cyan')"></button>
<button style="background:pink" onclick="setColor('pink')"></button>
</div>

<h3>🎭 Аватар</h3>
<button onclick="setAvatar('🔫')">🔫</button>
<button onclick="setAvatar('📷')">📷</button>
<button onclick="setAvatar('🎩')">🎩</button>
<button onclick="setAvatar('📺')">📺</button>
<button onclick="setAvatar('🎥')">🎥</button>
<button onclick="setAvatar('🧸')">🧸</button>
<button onclick="setAvatar('🕶️')">🕶️</button>

<h3>📊 Статистика</h3>
<p>Coins: <span id="statCoins"></span></p>
<p>Gold: <span id="statGold"></span></p>
<p>Skins: <span id="statSkins"></span></p>
<p>Time: <span id="timePlayed"></span> сек</p>

<button onclick="reset()">Reset</button>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('click')">Click</button>
<button onclick="show('shop')">Shop</button>
<button onclick="show('cases')">Cases</button>
<button onclick="show('inv')">Inv</button>
<button onclick="show('promo')">Promo</button>
<button onclick="show('profile')">Profile</button>
</div>

<script>

let coins=0,gold=0,power=1,upgradeCost=100;
let inventory=[],time=0;
let usedCodes=[];

let stats={coins:0,gold:0,skins:0};

let playerName="Player",playerColor="white",avatar="🔫";

/* CASES */
const cases={
Marshmall:[["Candy AK","Common"],["Sweet Knife","Rare"]],
Sand:[["Sand AWP","Rare"],["Golden Sand","Epic"]],
Jlister:[["J Gun","Epic"]],
Reapel:[["Reaper","Legendary"]],
Pro:[["Fire Skin","Mythic"]],
Sticker:[["Sticker Skull","Common"],["Sticker Gold","Legendary"]]
};

const prices={
Marshmall:200,Sand:400,Jlister:600,Reapel:800,Pro:1000,Sticker:500
};

/* PROMO CODES */
const codes=[
"Block Strike","Pro48k","PositIv4IkBS","Update","Gold",
"Marsh","Holiday's","Top","Sand","2025","2026","2027 year",
"BRDAY","Happy year"
];

/* LOAD */
try{
let d=JSON.parse(localStorage.getItem("save"));
if(d){
coins=d.coins||0;
gold=d.gold||0;
inventory=d.inventory||[];
stats=d.stats||stats;
playerName=d.playerName||playerName;
playerColor=d.playerColor||playerColor;
avatar=d.avatar||avatar;
time=d.time||0;
usedCodes=d.usedCodes||[];
}
}catch{}

/* TIMER */
setInterval(()=>{time++;update()},1000);

/* CLICK */
function clickGun(){
coins++;gold++;
stats.coins++;stats.gold++;
update();
}

/* UPGRADE */
function upgrade(){
if(gold>=upgradeCost){
gold-=upgradeCost;
power++;
upgradeCost+=100;
update();
}
}

/* SHOP */
function buy(name,price){
if(coins>=price){
coins-=price;
stats.coins+=price;
inventory.push(name);
stats.skins++;
update();
}else alert("Нема коінів");
}

/* CASE */
function openCase(t){
let p=prices[t];

if(t==="Sticker"){
if(coins<p)return;
coins-=p;
}else{
if(gold<p)return;
gold-=p;
}

let item=cases[t][Math.floor(Math.random()*cases[t].length)];
inventory.push(item[0]+" ("+item[1]+")");
stats.skins++;

caseResult.innerText=item[0]+" - "+item[1];
update();
}

/* SELL */
function sell(i){
let item=inventory[i];

if(item.includes("Galactic")){
gold+=15000;
}else{
coins+=25;
}

inventory.splice(i,1);
update();
}

/* INVENTORY */
function renderInv(){
let html="";
inventory.forEach((i,x)=>{
html+=`<div class="card">${i}<button onclick="sell(${x})">Sell</button></div>`;
});
document.getElementById("inventory").innerHTML=html;
}

/* PROMO */
function useCode(){
let val=document.getElementById("codeInput").value;

if(usedCodes.includes(val)){
promoMsg.innerText="Вже використано";
return;
}

/* SPECIAL GALACTIC */
if(val==="Galactic"){
inventory.push("Karambit Galactic (Mythic)");
usedCodes.push(val);
promoMsg.innerText="🔥 Отримано Karambit Galactic!";
update();
return;
}

if(codes.includes(val)){
gold+=100;
stats.gold+=100;
usedCodes.push(val);
promoMsg.innerText="+100 Gold";
update();
}else{
promoMsg.innerText="Невірний код";
}
}

/* PROFILE */
function saveProfile(){
playerName=document.getElementById("nickname").value||playerName;
update();
}
function setColor(c){playerColor=c;update();}
function setAvatar(a){avatar=a;update();}
function reset(){localStorage.clear();location.reload();}

/* UPDATE */
function update(){
coinsEl.innerText=coins;
goldEl.innerText=gold;

nameEl.innerText=playerName;
nameEl.style.color=playerColor;
avatarEl.innerText=avatar;

statCoins.innerText=stats.coins;
statGold.innerText=stats.gold;
statSkins.innerText=stats.skins;
timePlayed.innerText=time;

renderInv();
save();
}

/* SAVE */
function save(){
localStorage.setItem("save",JSON.stringify({
coins,gold,inventory,stats,playerName,playerColor,avatar,time,usedCodes
}));
}

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

/* ELEMENTS */
const coinsEl=document.getElementById("coins");
const goldEl=document.getElementById("gold");
const nameEl=document.getElementById("name");
const avatarEl=document.getElementById("avatar");
const statCoins=document.getElementById("statCoins");
const statGold=document.getElementById("statGold");
const statSkins=document.getElementById("statSkins");
const timePlayed=document.getElementById("timePlayed");
const promoMsg=document.getElementById("promoMsg");
const caseResult=document.getElementById("caseResult");

/* LOADING */
setTimeout(()=>{
document.getElementById("loading").style.display="none";
update();
},1000);

</script>

</body>
                                               </html>
