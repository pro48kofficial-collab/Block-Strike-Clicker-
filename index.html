<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Strike Clicker FULL</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

/* LOADING */
#loading{
position:fixed;
inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
z-index:999;
}

/* TOP */
.top{
padding:10px;
font-size:18px;
}

/* PAGES */
.page{display:none;padding:10px}
.active{display:block}

/* BUTTONS */
button{
padding:10px;
margin:5px;
border-radius:10px;
border:none;
background:#1f2937;
color:white;
cursor:pointer;
}

/* BOTTOM MENU (НОРМАЛЬНІ КНОПКИ) */
.nav{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
overflow-x:auto;
background:#111827;
}

.nav button{
flex:0 0 auto;
min-width:90px;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">Loading Game...</div>

<!-- TOP -->
<div class="top">
👤 <span id="name">Player</span> <span id="avatar">🔫</span><br>
💰 Coins: <span id="coins">0</span> |
🟡 Gold: <span id="gold">0</span> |
⬆ Upgrade: <span id="upgradeCost">100</span>
</div>

<!-- CLICK -->
<div id="click" class="page active">
<h2>🔫 Click</h2>
<button onclick="clickGun()">CLICK</button>
<button onclick="upgrade()">UPGRADE</button>
</div>

<!-- SHOP -->
<div id="shop" class="page">
<h2>🏪 Shop</h2>
<button onclick="buy('AK-47',100)">AK-47</button>
<button onclick="buy('AWP',300)">AWP</button>
<button onclick="buy('Knife',50)">Knife</button>
</div>

<!-- CASES -->
<div id="cases" class="page">
<h2>📦 Cases</h2>

<button onclick="openCase('Pro',1000)">Pro Case</button>
<button onclick="openCase('Sand',500)">Sand Case</button>
<button onclick="openCase('Jlister',700)">Jlister</button>
<button onclick="openCase('Reapel',900)">Reapel</button>

<button onclick="openSticker()">Sticker (500 coins)</button>
</div>

<!-- WHEEL -->
<div id="wheel" class="page">
<h2>🎡 Wheel</h2>
<button onclick="spinWheel()">SPIN (50K gold)</button>
<p id="wheelResult"></p>
</div>

<!-- INVENTORY -->
<div id="inv" class="page">
<h2>🎒 Inventory</h2>
<div id="inventory"></div>
</div>

<!-- PROMO -->
<div id="promo" class="page">
<h2>🎁 Promo Codes</h2>
<input id="codeInput" placeholder="Code">
<br>
<button onclick="useCode()">ACTIVATE</button>
<p id="promoMsg"></p>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
<h2>👤 Profile</h2>

<input id="nickname" placeholder="Name">
<button onclick="saveProfile()">Save</button>

<h3>🎨 Avatar</h3>
<button onclick="setAvatar('🔫')">🔫</button>
<button onclick="setAvatar('📷')">📷</button>
<button onclick="setAvatar('🎩')">🎩</button>
<button onclick="setAvatar('🕶️')">🕶️</button>

<h3>🎨 Color</h3>
<button onclick="setColor('red')">Red</button>
<button onclick="setColor('blue')">Blue</button>
<button onclick="setColor('lime')">Green</button>
<button onclick="setColor('white')">White</button>

</div>

<!-- NAV BUTTONS (ТОЛЬКИ КНОПКИ, ВСЕ ЗБЕРЕЖЕНО) -->
<div class="nav">
<button onclick="show('click')">Click</button>
<button onclick="show('shop')">Shop</button>
<button onclick="show('cases')">Cases</button>
<button onclick="show('wheel')">Wheel</button>
<button onclick="show('inv')">Inv</button>
<button onclick="show('promo')">Promo</button>
<button onclick="show('profile')">Profile</button>
</div>

<script>

/* DATA (ВСЕ ЗБЕРЕЖЕНО) */
let coins=0;
let gold=0;
let upgradeCost=100;
let clickPower=1;
let inventory=[];
let usedCodes=[];

let playerName="Player";
let playerColor="white";
let avatar="🔫";

/* CASES */
const cases={
Pro:["AK Pro","M4 Elite","AWP Star"],
Sand:["AK Sand","AWP Desert"],
Jlister:["AK Toxic","AWP Virus"],
Reapel:["AK Reaper","Knife Death"]
};

/* LOADING */
setTimeout(()=>{
document.getElementById("loading").style.display="none";
update();
},1200);

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

/* CLICK */
function clickGun(){
coins++;
gold+=clickPower;
update();
}

/* UPGRADE */
function upgrade(){
if(gold>=upgradeCost){
gold-=upgradeCost;
clickPower=2;
upgradeCost+=100;
update();
}
}

/* SHOP */
function buy(item,price){
if(coins>=price){
coins-=price;
inventory.push(item);
update();
}
}

/* CASES */
function openCase(type,price){
if(gold<price)return;
gold-=price;
inventory.push(cases[type][Math.floor(Math.random()*cases[type].length)]);
update();
}

/* STICKER */
function openSticker(){
if(coins<500)return;
coins-=500;
inventory.push("Sticker Pack");
update();
}

/* WHEEL */
function spinWheel(){
if(gold<50000){
wheelResult.innerText="Need 50K";
return;
}

gold-=50000;

let r=Math.random()*100;

if(r<1)inventory.push("Bayonet BS");
else if(r<5)gold+=200000;
else if(r<10)inventory.push("AK Legend");
else if(r<30)gold+=600;
else gold+=100;

update();
}

/* PROMO */
function useCode(){
let v=document.getElementById("codeInput").value;

if(usedCodes.includes(v))return;

if(v==="Galactic"){
inventory.push("Karambit Galactic");
usedCodes.push(v);
update();
return;
}

gold+=100;
usedCodes.push(v);
update();
}

/* PROFILE */
function saveProfile(){
playerName=document.getElementById("nickname").value||playerName;
update();
}

function setAvatar(a){
avatar=a;
update();
}

function setColor(c){
playerColor=c;
update();
}

/* INVENTORY */
function renderInv(){
let html="";
inventory.forEach((i,x)=>{
html+=`<div>${i}</div>`;
});
document.getElementById("inventory").innerHTML=html;
}

/* UPDATE */
function update(){

coinsEl.innerText=coins;
goldEl.innerText=gold;

nameEl.innerText=playerName;
nameEl.style.color=playerColor;
avatarEl.innerText=avatar;

renderInv();
save();
}

/* SAVE */
function save(){
localStorage.setItem("save",JSON.stringify({
coins,gold,upgradeCost,clickPower,
inventory,usedCodes,
playerName,playerColor,avatar
}));
}

/* LOAD */
try{
let d=JSON.parse(localStorage.getItem("save"));
if(d){
coins=d.coins||0;
gold=d.gold||0;
upgradeCost=d.upgradeCost||100;
clickPower=d.clickPower||1;
inventory=d.inventory||[];
usedCodes=d.usedCodes||[];
playerName=d.playerName||"Player";
playerColor=d.playerColor||"white";
avatar=d.avatar||"🔫";
}
}catch{}

/* ELEMENTS */
const coinsEl=document.getElementById("coins");
const goldEl=document.getElementById("gold");
const nameEl=document.getElementById("name");
const avatarEl=document.getElementById("avatar");

</script>

</body>
  </html>
