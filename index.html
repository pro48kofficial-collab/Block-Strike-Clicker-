<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Block Strike Clicker</title>

<style>
body{
  font-family: Arial;
  background:#0b1220;
  color:white;
  text-align:center;
}

button{padding:10px; margin:5px; cursor:pointer}

.card{
  border:1px solid #333;
  margin:10px;
  padding:10px;
}
</style>
</head>

<body>

<h1>💰 Coins: <span id="coins">0</span></h1>

<hr>

<h2>🔫 Зброя</h2>
<img src="image.png" width="150" onclick="clickGun()" style="cursor:pointer">

<p>Power: <span id="power">1</span></p>

<button onclick="upgrade()">Upgrade (50💰)</button>

<hr>

<h2>🛒 Магазин</h2>
<button onclick="buy('AK-47', 100)">AK-47 - 100💰</button>
<button onclick="buy('Knife', 50)">Knife - 50💰</button>
<button onclick="buy('Sniper', 300)">Sniper - 300💰</button>

<hr>

<h2>📦 Кейси</h2>
<button onclick="openCase('Marshmall')">Marshmall</button>
<button onclick="openCase('Sand of Time')">Sand of Time</button>
<button onclick="openCase('Jlister')">Jlister</button>
<button onclick="openCase('Past Reapel')">Past Reapel</button>

<hr>

<h2>🎒 Інвентар</h2>
<div id="inventory"></div>

<script>
let coins = 0;
let power = 1;
let inventory = [];

// load
if(localStorage.getItem("save")){
  let data = JSON.parse(localStorage.getItem("save"));
  coins = data.coins;
  power = data.power;
  inventory = data.inventory;
  update();
}

// клік
function clickGun(){
  coins += power;
  update();
}

// апгрейд
function upgrade(){
  if(coins >= 50){
    coins -= 50;
    power++;
    update();
  }
}

// магазин
function buy(name, price){
  if(coins >= price){
    coins -= price;
    inventory.push(name);
    update();
  }
}

// кейси
const cases = {
  "Marshmall": ["AK-47 M", "Knife M", "Rare Gun M"],
  "Sand of Time": ["AK-47 S", "Desert Eagle S", "Golden Knife"],
  "Jlister": ["J-Pistol", "J-Rifle", "J-Sniper"],
  "Past Reapel": ["Ghost AK", "Reaper Knife", "Dark Sniper"]
}

function openCase(type){
  let items = cases[type];
  let item = items[Math.floor(Math.random()*items.length)];
  inventory.push(item);
  update();
}

// продаж
function sell(index){
  coins += 20;
  inventory.splice(index,1);
  update();
}

// оновлення
function update(){
  document.getElementById("coins").innerText = coins;
  document.getElementById("power").innerText = power;

  let inv = "";
  inventory.forEach((item, i)=>{
    inv += `
      <div class="card">
        ${item}
        <button onclick="sell(${i})">💰 Sell (20)</button>
      </div>
    `;
  });

  document.getElementById("inventory").innerHTML = inv;

  save();
}

// збереження
function save(){
  localStorage.setItem("save", JSON.stringify({
    coins,
    power,
    inventory
  }));
}
</script>

</body>
    </html>
